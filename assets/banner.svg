<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="360" preserveAspectRatio="xMidYMid meet" viewBox="0 0 1200 360"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0a0f1d"/><stop offset="50%" stop-color="#0d1829"/><stop offset="100%" stop-color="#050a14"/></linearGradient><linearGradient id="borderGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8" stop-opacity=".8"/><stop offset="50%" stop-color="#818cf8" stop-opacity=".8"/><stop offset="100%" stop-color="#c084fc" stop-opacity=".8"/></linearGradient><linearGradient id="cyanPurple" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="100%" stop-color="#818cf8"/></linearGradient><linearGradient id="badgeGlow" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#0284c7" stop-opacity=".4"/><stop offset="100%" stop-color="#6366f1" stop-opacity=".4"/></linearGradient><pattern id="cyberGrid" width="40" height="40" patternUnits="userSpaceOnUse"><path fill="none" stroke="#1e293b" stroke-opacity=".5" stroke-width=".8" d="M 40 0 L 0 0 0 40"/><circle cx="40" cy="40" r="1.5" fill="#38bdf8" fill-opacity=".3"/></pattern><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter></defs><style>@keyframes pulseOrb{0%{transform:scale(1);opacity:.25}50%{transform:scale(1.15);opacity:.45}}@keyframes floatParticle{0%{transform:translateY(0) translateX(0);opacity:.2}50%{transform:translateY(-20px) translateX(10px);opacity:.7}}@keyframes streamBeam{0%{stroke-dashoffset:400}}@keyframes lockShieldGlow{0%{filter:drop-shadow(0 0 8px rgba(56,189,248,.4))}50%{filter:drop-shadow(0 0 18px rgba(129,140,248,.8))}}.subtitle-text,.title-text{font-family:-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif}.title-text{font-weight:800;font-size:38px;fill:#fff;letter-spacing:-.5px}.subtitle-text{font-weight:500;font-size:16px;fill:#94a3b8}.code-term{font-family:&apos;SF Mono&apos;,Monaco,Consolas,&apos;Liberation Mono&apos;,&apos;Courier New&apos;,monospace;font-size:13px;fill:#38bdf8}.pill-text{font-family:-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,sans-serif;font-weight:600;font-size:12px;fill:#e2e8f0}.bg-orb-1{transform-origin:200px 100px;animation:pulseOrb 8s ease-in-out infinite}.bg-orb-2{transform-origin:1000px 250px;animation:pulseOrb 10s ease-in-out infinite 2s}.particle-1{animation:floatParticle 6s ease-in-out infinite}.particle-2{animation:floatParticle 8s ease-in-out infinite 1.5s}.particle-3{animation:floatParticle 7s ease-in-out infinite 3s}.beam-line{stroke-dasharray:80,120;animation:streamBeam 5s linear infinite}.shield-badge{animation:lockShieldGlow 4s ease-in-out infinite}</style><rect width="1200" height="360" fill="url(#bgGrad)" rx="16"/><rect width="1200" height="360" fill="url(#cyberGrid)" rx="16"/><g opacity=".35"><circle cx="220" cy="90" r="180" fill="#0284c7" class="bg-orb-1" filter="url(#glow)"/><circle cx="1020" cy="240" r="210" fill="#6366f1" class="bg-orb-2" filter="url(#glow)"/></g><g stroke-width="1.5" opacity=".4"><path fill="none" stroke="#38bdf8" d="M 60 70 Q 300 20 600 70 T 1140 70" class="beam-line"/><path fill="none" stroke="#818cf8" d="M 60 290 Q 400 340 700 290 T 1140 290" class="beam-line" style="animation-duration:7s"/></g><g fill="#38bdf8"><circle cx="140" cy="120" r="2.5" class="particle-1"/><circle cx="380" cy="60" r="2" class="particle-2"/><circle cx="820" cy="90" r="3" class="particle-3"/><circle cx="1060" cy="140" r="2" class="particle-1"/><circle cx="950" cy="310" r="2.5" class="particle-2"/><circle cx="260" cy="300" r="2" class="particle-3"/></g><rect width="1197" height="357" x="1.5" y="1.5" fill="none" stroke="url(#borderGrad)" stroke-width="2" rx="15"/><g transform="translate(60, 42)"><rect width="250" height="32" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2" rx="16"/><circle cx="18" cy="16" r="5" fill="#10b981"/><text x="32" y="21" fill="#38bdf8" class="code-term" font-weight="600">ZERO-TRUST ARCHITECTURE</text></g><g transform="translate(930, 42)"><rect width="210" height="32" fill="#0f172a" stroke="#475569" stroke-width="1.2" rx="16"/><text x="16" y="21" fill="#a7f3d0" class="code-term">ssh -p 22 admin@bastion</text></g><g class="shield-badge" transform="translate(60, 95)"><rect width="70" height="70" fill="url(#cyanPurple)" rx="18"/><path fill="#0a0f1d" d="M 35 15 L 20 22 C 20 37 26 48 35 55 C 44 48 50 37 50 22 Z"/><rect width="10" height="9" x="30" y="32" fill="#38bdf8" rx="2"/><path fill="none" stroke="#38bdf8" stroke-width="2" d="M 32 32 L 32 28 C 32 26 38 26 38 28 L 38 32"/></g><text x="146" y="132" class="title-text">Awesome Restricted Shells &amp; Secure SSH Access</text><text x="148" y="158" class="subtitle-text">Curated Production Ecosystem • Bastion Gateways • Zero-Trust PAM • Ephemeral SSH CAs • Audit Logging</text><g transform="translate(60, 186)"><rect width="1080" height="64" fill="#020617" stroke="#1e293b" stroke-width="1.5" rx="10"/><circle cx="24" cy="32" r="5" fill="#ef4444"/><circle cx="40" cy="32" r="5" fill="#f59e0b"/><circle cx="56" cy="32" r="5" fill="#10b981"/><line x1="74" x2="74" y1="16" y2="48" stroke="#334155" stroke-width="1"/><text x="92" y="37" fill="#94a3b8" class="code-term">$ <tspan fill="#38bdf8">tsh</tspan> login --auth=github &amp;&amp; <tspan fill="#818cf8">ssh</tspan> bastion-gw <tspan fill="#64748b"># Enforcing short-lived certs, chroot sandbox &amp; audit trails</tspan></text></g><g><g transform="translate(60, 270) translate(0, 0)"><rect width="245" height="42" fill="#0f172a" stroke="#334155" stroke-width="1.2" rx="8"/><text x="16" y="26" class="pill-text">🔑 Ephemeral SSH Certificates</text></g><g transform="translate(60, 270) translate(260, 0)"><rect width="220" height="42" fill="#0f172a" stroke="#334155" stroke-width="1.2" rx="8"/><text x="16" y="26" class="pill-text">🛡️ Bastion &amp; Jump Hosts</text></g><g transform="translate(60, 270) translate(495, 0)"><rect width="235" height="42" fill="#0f172a" stroke="#334155" stroke-width="1.2" rx="8"/><text x="16" y="26" class="pill-text">🔒 Restricted Shells &amp; Jails</text></g><g transform="translate(60, 270) translate(745, 0)"><rect width="225" height="42" fill="#0f172a" stroke="#334155" stroke-width="1.2" rx="8"/><text x="16" y="26" class="pill-text">📹 Session Recording &amp; Audit</text></g><g transform="translate(60, 270) translate(985, 0)"><rect width="95" height="42" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2" rx="8"/><text x="14" y="26" fill="#38bdf8" class="pill-text">✨ PAM</text></g></g></svg>